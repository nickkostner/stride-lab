server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;
  include /etc/nginx/mime.types;
  location ~ \.mjs$ { default_type text/javascript; }
  location ~ \.wasm$ { default_type application/wasm; }

  # The browser talks WHEP (WebRTC) to the camera bridge through this path,
  # so the page and the stream share one origin. Both bridges serve WebRTC on 8889.
  location /cam/ {
    proxy_pass http://127.0.0.1:8889/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }
}
